# PRODUCTION configuration, tracked in git: every change is a commit, which is
# the record of what was collected when. Keys live in /etc/corners/secrets.env.
# Paths are absolute so this file can live inside a read-only release directory.
db_path = "/opt/corners/data/corners.db"
archive_dir = "/opt/corners/data/archive"
review_dir = "/opt/corners/data/review"

# Scheduled jobs that run. This list is the single source of truth:
#   - the planner creates slots only for these, and the watchdog checks only these;
#   - release.sh enables exactly these timers and disables the others;
#   - a timer that fires for a job not listed here does nothing and fails the watchdog.
# Add op_account and op_fixtures at RUNBOOK A11 step 6 (commit, then release.sh).
# op_history is free and does nothing until mappings exist.
active_jobs = ["af_fixtures", "af_odds", "af_results", "op_history"]

# Leagues to track. api-football ids; season = starting year (2026 = 2026/27).
# oddspapi_tournament_id: fill in from data/review/day1_oddspapi_tournaments.json
# (RUNBOOK R8), commit, and deploy. Until then OddsPapi skips that league.
# The default set is broader than EPL/Championship/UCL because the power
# estimate (DESIGN v0.4 §8) depends on fixtures per week. Trim it if you prefer.
[[leagues]]
league_id = 39     # Premier League
oddspapi_tournament_id = 17
season = 2026
[[leagues]]
league_id = 40     # Championship
oddspapi_tournament_id = 18
season = 2026
[[leagues]]
league_id = 2      # UEFA Champions League
oddspapi_tournament_id = 7
season = 2026
[[leagues]]
league_id = 140    # La Liga
oddspapi_tournament_id = 8
season = 2026
[[leagues]]
league_id = 135    # Serie A
oddspapi_tournament_id = 23
season = 2026
[[leagues]]
league_id = 78     # Bundesliga
oddspapi_tournament_id = 35
season = 2026
[[leagues]]
league_id = 61     # Ligue 1
oddspapi_tournament_id = 34
season = 2026
[[leagues]]
league_id = 3      # UEFA Europa League
oddspapi_tournament_id = 679
season = 2026

# Exploration seasons (2025/26): needed so OddsPapi history since January 2026
# can be mapped to api-football fixtures and outcomes. Give each the SAME
# oddspapi_tournament_id as its 2026 entry if OddsPapi uses one id across seasons.
# They never generate odds requests (no upcoming fixtures). Outcomes come from
# `run.sh af-backfill`.
[[leagues]]
league_id = 39
oddspapi_tournament_id = 17
season = 2025
[[leagues]]
league_id = 40
oddspapi_tournament_id = 18
season = 2025
[[leagues]]
league_id = 2
oddspapi_tournament_id = 7
season = 2025
[[leagues]]
league_id = 140
oddspapi_tournament_id = 8
season = 2025
[[leagues]]
league_id = 135
oddspapi_tournament_id = 23
season = 2025
[[leagues]]
league_id = 78
oddspapi_tournament_id = 35
season = 2025
[[leagues]]
league_id = 61
oddspapi_tournament_id = 34
season = 2025
[[leagues]]
league_id = 3
oddspapi_tournament_id = 679
season = 2025

[api_football]
odds_horizon_days = 14
min_interval_s = 0.25

[oddspapi]
bookmakers = "pinnacle"
monthly_billable_budget = 20     # our cap; the guard also keeps 50 below the provider limit
quota_reserve = 50
fixtures_refresh_days = 28       # 8 tournaments -> ~9 billable calls/month
# One-off: set to "2026-01-01T00:00:00Z" for the first listing so history
# back to January is discoverable, then remove it.
fixtures_from = "2026-01-01T00:00:00Z"
history_delay_h = 3.0
history_max_per_run = 60
